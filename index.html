<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b13">
<title>STRESS PUNCH v4</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
margin:0;min-height:100%;color:white;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
background:radial-gradient(circle at 50% 0,#1e2c49,#070b13 60%,#02040a)
}
button,textarea{font:inherit}
button{touch-action:manipulation}
.app{max-width:580px;margin:auto;padding:14px 14px 40px}
h1{margin:5px 0 12px;font-size:29px;font-weight:1000}
.panel{
background:#111827;border:1px solid #334155;
border-radius:20px;padding:15px
}
.label{font-size:13px;font-weight:900;margin:10px 0 7px}
.filebtn{
display:block;background:#1f2937;border:1px solid #475569;
border-radius:14px;padding:14px;text-align:center;font-weight:900
}
input[type=file]{display:none}
#filename{font-size:12px;color:#94a3b8;margin-top:7px}
textarea{
width:100%;height:90px;background:#0b1220;color:white;
border:1px solid #334155;border-radius:14px;padding:12px;resize:none
}
.start{
width:100%;margin-top:12px;border:0;border-radius:15px;
padding:15px;background:linear-gradient(135deg,#ef4444,#991b1b);
color:white;font-weight:1000;font-size:17px
}
#game{display:none}

.stat{display:grid;grid-template-columns:65px 1fr 52px;gap:7px;align-items:center;margin-bottom:7px}
.stat span{font-size:12px;font-weight:900}
.bar{height:14px;background:#1f2937;border:1px solid #475569;border-radius:999px;overflow:hidden}
.fill{height:100%;transform-origin:left;transition:.2s}
#hpbar{background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
#powerbar{background:linear-gradient(90deg,#3b82f6,#8b5cf6,#f59e0b)}
#ragebar{background:linear-gradient(90deg,#fb7185,#ef4444,#f97316)}

.chips{display:flex;gap:6px;justify-content:flex-end;margin:9px 0;flex-wrap:wrap}
.chip{background:#111827;border:1px solid #334155;border-radius:10px;padding:6px 9px;font-size:11px;font-weight:1000}

.stage{
height:470px;position:relative;overflow:hidden;
border-radius:25px;border:1px solid #475569;
background:
radial-gradient(circle at 50% 5%,#ffffff44,transparent 17%),
radial-gradient(circle at 15% 12%,#3b82f644,transparent 18%),
radial-gradient(circle at 85% 12%,#ef444444,transparent 18%),
linear-gradient(#101827 0 58%,#3f1d22 58% 61%,#0b1220 61%)
}
.light{
position:absolute;left:50%;top:-60px;transform:translateX(-50%);
width:220px;height:250px;
background:linear-gradient(180deg,#ffffff22,transparent);
clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)
}
.crowd{
position:absolute;left:0;right:0;bottom:0;height:145px;opacity:.6;
background:
radial-gradient(circle at 5% 35%,#64748b 0 7px,transparent 8px),
radial-gradient(circle at 15% 48%,#475569 0 8px,transparent 9px),
radial-gradient(circle at 25% 32%,#64748b 0 7px,transparent 8px),
radial-gradient(circle at 38% 50%,#475569 0 8px,transparent 9px),
radial-gradient(circle at 50% 30%,#64748b 0 7px,transparent 8px),
radial-gradient(circle at 63% 48%,#475569 0 8px,transparent 9px),
radial-gradient(circle at 76% 31%,#64748b 0 7px,transparent 8px),
radial-gradient(circle at 88% 48%,#475569 0 8px,transparent 9px),
radial-gradient(circle at 96% 33%,#64748b 0 7px,transparent 8px)
}
.rope{position:absolute;left:-5%;width:110%;height:5px;background:#e5e7eb;opacity:.7}
.r1{top:67%}.r2{top:77%}.r3{top:87%}

.target{
position:absolute;width:285px;height:330px;
left:50%;top:49%;transform:translate(-50%,-50%);
transition:left .17s,transform .17s
}
.target.dl{left:28%;transform:translate(-50%,-50%) rotate(-8deg)}
.target.dr{left:72%;transform:translate(-50%,-50%) rotate(8deg)}

.body{
position:absolute;left:50%;bottom:0;transform:translateX(-50%);
width:225px;height:180px;border-radius:100px 100px 25px 25px;
background:linear-gradient(#596274,#252c3a);
border:4px solid #7c8799;
box-shadow:inset 0 12px 20px #ffffff15,inset 0 -15px 25px #0008
}
.chest{
position:absolute;left:50%;top:20px;transform:translateX(-50%);
width:100px;height:125px;border-radius:50px;
background:linear-gradient(#d9a37b,#955e45);opacity:.55
}
.shoulder{
position:absolute;top:25px;width:72px;height:90px;
background:linear-gradient(#cb9670,#87563f);border-radius:50%
}
.sl{left:-27px;transform:rotate(18deg)}
.sr{right:-27px;transform:rotate(-18deg)}
.neck{
position:absolute;left:50%;top:121px;transform:translateX(-50%);
width:65px;height:58px;background:#b97859;border-radius:20px
}

.headbox{
position:absolute;width:170px;height:170px;
left:50%;top:12px;transform:translateX(-50%);z-index:5
}
.head{
position:absolute;inset:0;border-radius:50%;overflow:hidden;
border:5px solid #e5e7eb;background:#374151;
box-shadow:0 12px 30px #000a;
transform-origin:center
}
.head img{width:100%;height:100%;object-fit:cover}

.head.leftHit{animation:leftFace .22s}
.head.rightHit{animation:rightFace .22s}
.head.superHit{animation:superFace .36s}

@keyframes leftFace{
0%{transform:none}
45%{transform:translateX(-15px) rotate(-9deg) scaleX(.78) scaleY(1.1) skewY(-4deg)}
100%{transform:none}
}
@keyframes rightFace{
0%{transform:none}
45%{transform:translateX(15px) rotate(9deg) scaleX(.78) scaleY(1.1) skewY(4deg)}
100%{transform:none}
}
@keyframes superFace{
0%{transform:none}
30%{transform:scaleX(.6) scaleY(1.28) rotate(-7deg)}
58%{transform:scaleX(1.28) scaleY(.72) rotate(7deg)}
100%{transform:none}
}

.bruise{position:absolute;border-radius:50%;opacity:0;mix-blend-mode:multiply;transition:.25s}
.b1{width:45px;height:26px;left:15px;top:73px;background:#51267aa8}
.b2{width:48px;height:30px;right:13px;top:86px;background:#641f70a8}
.b3{width:37px;height:22px;left:59px;top:116px;background:#77194399}
.b4{width:31px;height:24px;right:49px;top:43px;background:#46236f99}
.swelling{
position:absolute;width:38px;height:22px;right:15px;top:63px;
border-radius:50%;background:#a23a7477;filter:blur(1px);opacity:0
}
.stars{
position:absolute;left:50%;top:-20px;transform:translateX(-50%);
font-size:29px;opacity:0
}
.stars.go{animation:stars .8s}
@keyframes stars{
0%{opacity:0;transform:translateX(-50%) scale(.5)}
25%{opacity:1}
100%{opacity:0;transform:translateX(-50%) translateY(-40px) rotate(30deg) scale(1.3)}
}

.glove{
position:absolute;width:112px;height:112px;bottom:10px;
border-radius:50%;z-index:10;
box-shadow:inset -12px -12px 18px #0005,inset 10px 10px 15px #ffffff20;
filter:drop-shadow(0 14px 12px #0009)
}
.glove:after{
content:"";position:absolute;bottom:-18px;left:28px;right:28px;height:31px;
background:#7f1d1d;border-radius:9px
}
.leftglove{
left:-110px;background:radial-gradient(circle at 35% 25%,#fb7185,#dc2626 58%,#7f1d1d);
border:5px solid #fecaca
}
.rightglove{
right:-110px;background:radial-gradient(circle at 35% 25%,#93c5fd,#2563eb 58%,#1e3a8a);
border:5px solid #dbeafe
}

.leftglove.punch{animation:lp .23s}
.rightglove.punch{animation:rp .23s}
.leftglove.hook{animation:lh .32s}
.rightglove.hook{animation:rh .32s}
.leftglove.upper{animation:lu .34s}
.rightglove.upper{animation:ru .34s}

@keyframes lp{
0%{left:-110px;bottom:10px}
55%{left:116px;bottom:200px;transform:scale(1.18)}
100%{left:-110px;bottom:10px}
}
@keyframes rp{
0%{right:-110px;bottom:10px}
55%{right:116px;bottom:200px;transform:scale(1.18)}
100%{right:-110px;bottom:10px}
}
@keyframes lh{
0%{left:-110px;bottom:50px}
50%{left:120px;bottom:210px;transform:rotate(65deg) scale(1.3)}
100%{left:-110px;bottom:50px}
}
@keyframes rh{
0%{right:-110px;bottom:50px}
50%{right:120px;bottom:210px;transform:rotate(-65deg) scale(1.3)}
100%{right:-110px;bottom:50px}
}
@keyframes lu{
0%{left:5px;bottom:-120px}
55%{left:120px;bottom:205px;transform:scale(1.4)}
100%{left:5px;bottom:-120px}
}
@keyframes ru{
0%{right:5px;bottom:-120px}
55%{right:120px;bottom:205px;transform:scale(1.4)}
100%{right:5px;bottom:-120px}
}

.impact{
position:absolute;left:50%;top:35%;width:130px;height:130px;
transform:translate(-50%,-50%);opacity:0;z-index:12;
border:6px solid white;border-radius:50%;
box-shadow:0 0 30px white,0 0 65px #f59e0b
}
.impact.go{animation:impact .28s}
@keyframes impact{
0%{opacity:1;transform:translate(-50%,-50%) scale(.15)}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
}

.pop{
position:absolute;left:50%;top:33%;z-index:15;
font-size:34px;font-weight:1000;text-shadow:0 4px 10px black;
animation:pop .7s forwards
}
@keyframes pop{
0%{opacity:0;transform:translate(-50%,0) scale(.6)}
20%{opacity:1}
100%{opacity:0;transform:translate(-50%,-100px) scale(1.2)}
}
.miss{color:#93c5fd}.heal{color:#86efac}.rageText{color:#fb7185}

.rageOverlay{
position:absolute;inset:0;pointer-events:none;opacity:0;z-index:18;
background:radial-gradient(circle,transparent 45%,#ef444444)
}
.rageOverlay.on{opacity:1;animation:ragepulse .5s infinite alternate}
@keyframes ragepulse{
to{box-shadow:inset 0 0 70px #ef444499}
}

.ko{
position:absolute;inset:0;background:#000c;z-index:30;
display:none;place-items:center;font-size:70px;font-weight:1000
}
.ko.show{display:grid}

.msg{
margin-top:10px;background:#0b1220;border:1px solid #334155;
border-radius:15px;padding:13px;min-height:76px;
font-weight:850;line-height:1.5
}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.punchbtn{
height:90px;border:0;border-radius:21px;color:white;
font-size:18px;font-weight:1000
}
.leftbtn{background:linear-gradient(145deg,#f43f5e,#991b1b)}
.rightbtn{background:linear-gradient(145deg,#60a5fa,#1d4ed8)}
.specials{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.special{
border:1px solid #475569;border-radius:13px;padding:12px 4px;
background:#1f2937;color:#64748b;font-weight:1000
}
.special.ready{
background:linear-gradient(135deg,#f59e0b,#dc2626);
color:white;border-color:#fbbf24;box-shadow:0 0 17px #f59e0b66
}
.ragebtn{
width:100%;margin-top:8px;border:1px solid #475569;border-radius:14px;
padding:14px;background:#1f2937;color:#64748b;font-weight:1000
}
.ragebtn.ready{
background:linear-gradient(135deg,#ef4444,#7f1d1d);
color:white;border-color:#fb7185;box-shadow:0 0 20px #ef444477
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.actions button{
border:0;border-radius:13px;padding:12px;color:white;font-weight:900
}
.reset{background:#273449}.finish{background:#15803d}
.result{
display:none;background:#052e16;border:1px solid #166534;
border-radius:14px;padding:13px;margin-top:10px;line-height:1.6
}
</style>
</head>

<body>

<div class="app" id="app">

<h1>🥊 STRESS PUNCH v4</h1>

<section id="setup" class="panel">

<div class="label">1. 상대 얼굴 사진</div>

<label class="filebtn" for="photo">
📷 사진 선택
</label>

<input id="photo" type="file" accept="image/*">

<div id="filename">선택된 사진 없음</div>

<div class="label">2. 왜 화났어?</div>

<textarea id="reason"
placeholder="예: 내 말을 계속 무시해서 열받음"></textarea>

<button id="start" class="start">
게임 시작 🔥
</button>

</section>

<section id="game">

<div class="stat">
<span>상대 HP</span>
<div class="bar"><div id="hpbar" class="fill"></div></div>
<span id="hpnum">100</span>
</div>

<div class="stat">
<span>POWER</span>
<div class="bar"><div id="powerbar" class="fill"></div></div>
<span id="powernum">0%</span>
</div>

<div class="stat">
<span>RAGE</span>
<div class="bar"><div id="ragebar" class="fill"></div></div>
<span id="ragenum">0%</span>
</div>

<div class="chips">
<div class="chip"><span id="hits">0</span> HIT</div>
<div class="chip">x<span id="combo">0</span> COMBO</div>
<div class="chip"><span id="dodges">0</span> DODGE</div>
<div class="chip"><span id="score">0</span> PTS</div>
</div>

<div class="stage" id="stage">

<div class="light"></div>
<div class="crowd"></div>

<div class="rope r1"></div>
<div class="rope r2"></div>
<div class="rope r3"></div>

<div id="target" class="target">

<div class="body">
<div class="chest"></div>
<div class="shoulder sl"></div>
<div class="shoulder sr"></div>
</div>

<div class="neck"></div>

<div class="headbox">

<div id="head" class="head">
<img id="face">
</div>

<div id="b1" class="bruise b1"></div>
<div id="b2" class="bruise b2"></div>
<div id="b3" class="bruise b3"></div>
<div id="b4" class="bruise b4"></div>

<div id="swelling" class="swelling"></div>

<div id="stars" class="stars">
⭐💫⭐
</div>

</div>

</div>

<div id="leftglove" class="glove leftglove"></div>
<div id="rightglove" class="glove rightglove"></div>

<div id="impact" class="impact"></div>

<div id="rageOverlay" class="rageOverlay"></div>

<div id="ko" class="ko">
K.O.
</div>

</div>

<div id="message" class="msg">
왼손/오른손을 섞어서 공격해봐.
</div>

<div class="controls">

<button id="left" class="punchbtn leftbtn">
🥊 왼손
</button>

<button id="right" class="punchbtn rightbtn">
🥊 오른손
</button>

</div>

<div class="specials">

<button id="straight" class="special" disabled>
⚡ 스트레이트
</button>

<button id="hook" class="special" disabled>
🌀 훅
</button>

<button id="upper" class="special" disabled>
⬆️ 어퍼컷
</button>

</div>

<button id="rage" class="ragebtn" disabled>
🔥 RAGE MODE
</button>

<div class="actions">

<button id="reset" class="reset">
다시 설정
</button>

<button id="finish" class="finish">
이제 됐다 😌
</button>

</div>

<div id="result" class="result"></div>

</section>

</div>

<script>

const $=x=>document.getElementById(x);

let image="";
let reason="";

let hp=100;
let power=0;
let rage=0;

let hits=0;
let combo=0;
let dodges=0;
let score=0;

let lastHit=0;
let dodgeStreak=0;

let rageMode=false;
let finished=false;

let audio=null;

const taunts=[
"어딜 때리냐 ㅋㅋ",
"느린데?",
"여기다 여기 👈",
"한 번 맞혀봐~",
"그게 펀치냐?",
"아깝다 ㅋㅋ",
"바람만 지나갔는데?"
];

const weakTaunts=[
"잠깐만;;",
"야 잠시만",
"아니 이건 좀;;",
"잠깐 얘기 좀 하자"
];

$("photo").onchange=e=>{

const file=e.target.files[0];

if(!file)return;

$("filename").innerText=file.name;

const reader=new FileReader();

reader.onload=x=>{
image=x.target.result;
};

reader.readAsDataURL(file);

};

function sound(strong=false){

try{

if(!audio)
audio=new(
window.AudioContext||
window.webkitAudioContext
)();

if(audio.state==="suspended")
audio.resume();

const o=audio.createOscillator();
const g=audio.createGain();

o.type="triangle";

o.frequency.setValueAtTime(
strong?60:90,
audio.currentTime
);

o.frequency.exponentialRampToValueAtTime(
35,
audio.currentTime+.12
);

g.gain.setValueAtTime(
strong?.35:.18,
audio.currentTime
);

g.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+.15
);

o.connect(g);
g.connect(audio.destination);

o.start();
o.stop(audio.currentTime+.16);

}catch(e){}

}

function vibe(strong=false){

if(!navigator.vibrate)return;

try{

navigator.vibrate(
strong
?[60,20,75]
:30
);

}catch(e){}

}

function pop(text,type=""){

const el=document.createElement("div");

el.className="pop "+type;

el.innerText=text;

$("stage").appendChild(el);

setTimeout(()=>{
el.remove();
},700);

}

function update(){

hp=Math.max(0,Math.min(100,hp));
power=Math.max(0,Math.min(100,power));
rage=Math.max(0,Math.min(100,rage));

$("hpbar").style.transform=
`scaleX(${hp/100})`;

$("powerbar").style.transform=
`scaleX(${power/100})`;

$("ragebar").style.transform=
`scaleX(${rage/100})`;

$("hpnum").innerText=
Math.round(hp);

$("powernum").innerText=
Math.round(power)+"%";

$("ragenum").innerText=
Math.round(rage)+"%";

$("hits").innerText=hits;
$("combo").innerText=combo;
$("dodges").innerText=dodges;
$("score").innerText=score;

const ready=
power>=100&&!finished;

["straight","hook","upper"]
.forEach(id=>{

$(id).disabled=!ready;

$(id).classList.toggle(
"ready",
ready
);

});

const rageReady=
rage>=100&&!rageMode&&!finished;

$("rage").disabled=!rageReady;

$("rage").classList.toggle(
"ready",
rageReady
);

}

function damageFace(){

$("b1").style.opacity=
hp<=82?1:0;

$("b2").style.opacity=
hp<=65?1:0;

$("b3").style.opacity=
hp<=45?1:0;

$("b4").style.opacity=
hp<=25?1:0;

$("swelling").style.opacity=
hp<=35?1:0;

}

function glove(side,type="punch"){

const g=
side==="left"
?$("leftglove")
:$("rightglove");

g.classList.remove(
"punch","hook","upper"
);

void g.offsetWidth;

g.classList.add(type);

}

function faceHit(side,strong=false){

const h=$("head");

h.className="head";

void h.offsetWidth;

if(strong){

h.classList.add("superHit");

$("stars").classList.remove("go");

void $("stars").offsetWidth;

$("stars").classList.add("go");

}else{

h.classList.add(
side==="left"
?"rightHit"
:"leftHit"
);

}

}

function impact(){

$("impact").classList.remove("go");

void $("impact").offsetWidth;

$("impact").classList.add("go");

}

function dodge(side){

dodges++;

combo=0;

dodgeStreak++;

hp+=3;

power+=8;

rage+=22;

const dir=
Math.random()>.5
?"dl":"dr";

$("target").classList.add(dir);

setTimeout(()=>{

$("target").classList.remove(
"dl","dr"
);

},270);

glove(side);

pop(
"MISS!",
"miss"
);

setTimeout(()=>{

pop(
"+3 HP",
"heal"
);

},100);

const list=
hp<30
?weakTaunts
:taunts;

const line=
list[
Math.floor(
Math.random()*list.length
)
];

$("message").innerText=
`😏 "${line}" — 피하면서 HP +3! RAGE +22%`;

update();

}

function punch(side){

if(finished)return;

let dodgeChance=
rageMode?0:.22;

if(hp<=50)
dodgeChance=
rageMode?0:.14;

if(hp<=25)
dodgeChance=
rageMode?0:.07;

if(dodgeStreak>=2)
dodgeChance=0;

if(
Math.random()
<
dodgeChance
){

dodge(side);

return;

}

dodgeStreak=0;

const now=Date.now();

combo=
now-lastHit<680
?combo+1
:1;

lastHit=now;

const critical=
combo%7===0;

let dmg=
rageMode?6:4;

if(critical)
dmg+=4;

hp-=dmg;

power+=
critical?16:11;

rage+=
critical?10:6;

hits++;

score+=
dmg*25+
combo*3;

glove(side);

faceHit(
side,
critical
);

impact();

sound(
critical
);

vibe(
critical
);

pop(
critical
?"CRITICAL!"
:["퍽!","퐉!","POW!","BAM!"]
[Math.floor(Math.random()*4)]
);

if(reason&&hits<5){

$("message").innerText=
`"${reason}" — 그 답답함만 여기다 날려.`;

}else if(critical){

$("message").innerText=
`🔥 ${combo} COMBO! CRITICAL -${dmg} HP`;

}else{

$("message").innerText=
`정통으로 들어갔다! -${dmg} HP`;

}

damageFace();

update();

checkKO();

}

function special(type){

if(
finished||
power<100
)return;

power=0;

let dmg=22;
let text="SUPER STRAIGHT";
let animation="punch";

if(type==="hook"){

dmg=26;
text="HEAVY HOOK";
animation="hook";

}

if(type==="upper"){

dmg=24;
text="UPPERCUT";
animation="upper";

}

const side=
Math.random()>.5
?"left":"right";

hp-=dmg;

hits++;
combo++;

score+=
dmg*40+250;

glove(
side,
animation
);

faceHit(
side,
true
);

impact();

sound(true);
vibe(true);

pop(
"💥 "+text+"!"
);

$("message").innerText=
`⚡ ${text}! 회피 불가! -${dmg} HP`;

damageFace();

update();

checkKO();

}

function rageStart(){

if(
rage<100||
rageMode||
finished
)return;

rage=0;

rageMode=true;

$("rageOverlay")
.classList.add("on");

pop(
"🔥 RAGE MODE!",
"rageText"
);

$("message").innerText=
"🔥 5초 동안 상대 회피 불가 + 펀치 데미지 강화!";

update();

setTimeout(()=>{

rageMode=false;

$("rageOverlay")
.classList.remove("on");

$("message").innerText=
"RAGE 종료!";

update();

},5000);

}

function checkKO(){

if(hp>0)return;

hp=0;

finished=true;

update();

$("ko")
.classList.add("show");

$("message").innerText=
"K.O.! 오늘 스트레스는 여기까지.";

let grade="C";

if(score>=2500)grade="B";
if(score>=4500)grade="A";
if(score>=6500)grade="S";

$("result").style.display=
"block";

$("result").innerHTML=
`🥊 <b>${hits} HIT / ${dodges} DODGE</b><br>
점수 ${score}점 · 등급 <b>${grade}</b>`;

}

$("start").onclick=()=>{

if(!image){

alert(
"먼저 얼굴 사진을 선택해줘."
);

return;

}

reason=
$("reason").value.trim();

$("face").src=image;

hp=100;
power=0;
rage=0;

hits=0;
combo=0;
dodges=0;
score=0;

dodgeStreak=0;

rageMode=false;
finished=false;

$("ko").classList.remove("show");

$("result").style.display="none";

["b1","b2","b3","b4","swelling"]
.forEach(id=>{
$(id).style.opacity=0;
});

$("setup").style.display="none";

$("game").style.display="block";

$("message").innerText=
reason
?`"${reason}" 때문에 쌓였지? 잡아보자. 근데 얘가 피하면서 놀린다.`
:"잡아보자. 근데 얘가 피하면서 놀린다.";

update();

window.scrollTo(0,0);

};

$("left").onpointerdown=e=>{

e.preventDefault();

punch("left");

};

$("right").onpointerdown=e=>{

e.preventDefault();

punch("right");

};

$("straight").onclick=()=>special("straight");

$("hook").onclick=()=>special("hook");

$("upper").onclick=()=>special("upper");

$("rage").onclick=rageStart;

$("reset").onclick=()=>{

$("game").style.display="none";

$("setup").style.display="block";

};

$("finish").onclick=()=>{

finished=true;

$("result").style.display="block";

$("result").innerHTML=
`😌 <b>${hits} HIT 후 종료</b><br>
오늘 스트레스는 여기까지만.`;

$("message").innerText=
"종료! 기분 전환하고 가자.";

};

update();

</script>

</body>
</html>
