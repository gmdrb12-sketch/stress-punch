<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b13">
<title>STRESS PUNCH v3</title>
<style>
:root{
  --bg:#070b13;--panel:#111827;--line:#2a3549;--text:#f8fafc;--muted:#94a3b8;
  --red:#ef4444;--blue:#3b82f6;--gold:#f59e0b;--green:#22c55e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;min-height:100%;
  background:radial-gradient(circle at 50% 0,#1a2940 0,#0a101c 48%,#05070c 100%);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif
}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
.app{width:min(100%,560px);margin:0 auto;padding:14px 14px 36px}
.logo{display:flex;align-items:end;justify-content:space-between;margin:4px 0 12px}
.logo h1{margin:0;font-size:28px;font-weight:1000}
.logo small{color:#fca5a5;font-weight:900}
.panel{
  background:#111827;
  border:1px solid #2a3549;
  border-radius:20px;
  padding:15px;
}
.label{font-size:13px;font-weight:900;margin-bottom:7px}
.row{margin-bottom:13px}
.file-btn{
  display:block;background:#1f2937;border:1px solid #374151;
  border-radius:14px;padding:13px;text-align:center;font-weight:900
}
input[type=file]{display:none}
.file-name{font-size:12px;color:#94a3b8;margin-top:7px}
textarea{
  width:100%;height:92px;resize:none;
  background:#0b1220;border:1px solid #334155;
  border-radius:14px;color:white;padding:12px
}
.btn{
  border:0;border-radius:15px;padding:14px;
  font-weight:1000;color:white
}
.start{
  width:100%;
  background:linear-gradient(135deg,#ef4444,#b91c1c)
}
.game{display:none}

.stats{display:grid;gap:8px;margin-bottom:10px}
.statrow{
  display:grid;
  grid-template-columns:70px 1fr 58px;
  gap:8px;
  align-items:center
}
.statlabel{font-size:12px;font-weight:1000}
.bar{
  height:14px;border-radius:999px;
  background:#1f2937;overflow:hidden;
  border:1px solid #374151
}
.fill{
  height:100%;
  width:100%;
  transform-origin:left;
  transition:transform .2s ease
}
.hpfill{background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
.powerfill{background:linear-gradient(90deg,#3b82f6,#8b5cf6,#f59e0b)}
.statnum{text-align:right;font-size:12px;font-weight:1000}

.topchips{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-bottom:8px
}
.chip{
  background:#111827;
  border:1px solid #334155;
  border-radius:12px;
  padding:7px 10px;
  font-size:12px;
  font-weight:1000
}

.stage{
  position:relative;
  height:450px;
  overflow:hidden;
  border-radius:24px;
  border:1px solid #344155;
  background:
    radial-gradient(circle at 50% 28%,rgba(255,255,255,.08),transparent 28%),
    linear-gradient(#18243b 0 62%,#4a1f22 62% 64%,#101827 64% 100%);
  user-select:none
}
.rope{
  position:absolute;left:-10px;right:-10px;
  height:4px;background:#d1d5db;opacity:.62
}
.r1{top:67%}.r2{top:77%}.r3{top:87%}

.target{
  position:absolute;
  left:50%;top:48%;
  transform:translate(-50%,-50%);
  width:260px;height:310px;
  transition:left .18s ease,transform .18s ease
}
.target.dodge-left{
  left:30%;
  transform:translate(-50%,-50%) rotate(-6deg)
}
.target.dodge-right{
  left:70%;
  transform:translate(-50%,-50%) rotate(6deg)
}
.target.wobble{animation:wobble .45s ease}
@keyframes wobble{
  0%,100%{transform:translate(-50%,-50%) rotate(0)}
  25%{transform:translate(-53%,-50%) rotate(-4deg)}
  60%{transform:translate(-47%,-50%) rotate(5deg)}
}

.torso{
  position:absolute;
  left:50%;bottom:8px;
  transform:translateX(-50%);
  width:215px;height:160px;
  border-radius:90px 90px 28px 28px;
  background:linear-gradient(#626b7d,#2d3648);
  border:4px solid #7a879c
}
.neck{
  position:absolute;
  left:50%;top:118px;
  transform:translateX(-50%);
  width:62px;height:55px;
  border-radius:20px;
  background:#bc8061
}
.headwrap{
  position:absolute;
  left:50%;top:18px;
  transform:translateX(-50%);
  width:164px;height:164px;
  z-index:4
}
.head{
  position:absolute;
  inset:0;
  border-radius:50%;
  overflow:hidden;
  background:#374151;
  border:5px solid #e5e7eb;
  box-shadow:0 12px 30px #0008
}
.head img{
  width:100%;
  height:100%;
  object-fit:cover
}

.head.hit-left{animation:headLeft .2s ease-out}
.head.hit-right{animation:headRight .2s ease-out}
@keyframes headLeft{
  0%{transform:rotate(0)}
  45%{transform:translateX(-11px) rotate(-8deg)}
  100%{transform:rotate(0)}
}
@keyframes headRight{
  0%{transform:rotate(0)}
  45%{transform:translateX(11px) rotate(8deg)}
  100%{transform:rotate(0)}
}

.bruise{
  position:absolute;
  border-radius:50%;
  opacity:0;
  transition:opacity .25s ease;
  mix-blend-mode:multiply
}
.b1{
  width:42px;height:25px;
  left:18px;top:72px;
  background:rgba(80,40,120,.62)
}
.b2{
  width:48px;height:30px;
  right:14px;top:84px;
  background:rgba(92,35,105,.58)
}
.b3{
  width:35px;height:20px;
  left:53px;top:112px;
  background:rgba(110,25,70,.48)
}
.b4{
  width:28px;height:22px;
  right:48px;top:42px;
  background:rgba(70,35,120,.5)
}

.glove{
  position:absolute;
  bottom:16px;
  width:105px;height:105px;
  border-radius:50%;
  z-index:8;
  opacity:.98
}
.left-glove{
  left:-95px;
  background:radial-gradient(circle at 38% 28%,#fb7185,#dc2626 60%,#7f1d1d);
  border:4px solid #fecaca
}
.right-glove{
  right:-95px;
  background:radial-gradient(circle at 38% 28%,#93c5fd,#2563eb 60%,#1e3a8a);
  border:4px solid #dbeafe
}

.left-glove.punch{animation:leftPunch .24s}
.right-glove.punch{animation:rightPunch .24s}

@keyframes leftPunch{
  0%{left:-95px;bottom:16px}
  55%{left:106px;bottom:188px;transform:scale(1.1)}
  100%{left:-95px;bottom:16px}
}
@keyframes rightPunch{
  0%{right:-95px;bottom:16px}
  55%{right:106px;bottom:188px;transform:scale(1.1)}
  100%{right:-95px;bottom:16px}
}

.left-glove.super{animation:leftSuper .34s}
.right-glove.super{animation:rightSuper .34s}
@keyframes leftSuper{
  0%{left:-110px;bottom:0;transform:scale(.8)}
  55%{left:112px;bottom:190px;transform:scale(1.5)}
  100%{left:-110px;bottom:0;transform:scale(.8)}
}
@keyframes rightSuper{
  0%{right:-110px;bottom:0;transform:scale(.8)}
  55%{right:112px;bottom:190px;transform:scale(1.5)}
  100%{right:-110px;bottom:0;transform:scale(.8)}
}

.pop{
  position:absolute;
  z-index:13;
  font-size:34px;
  font-weight:1000;
  text-shadow:0 4px 9px black;
  animation:pop .65s ease-out forwards
}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-90px) scale(1.2)}
}
.miss{color:#93c5fd}
.heal{color:#86efac}

.ko{
  position:absolute;
  inset:0;
  display:none;
  place-items:center;
  background:#000b;
  z-index:20;
  font-size:66px;
  font-weight:1000
}
.ko.show{display:grid}

.msg{
  margin-top:10px;
  padding:13px 14px;
  border-radius:16px;
  background:#0b1220;
  border:1px solid #334155;
  min-height:76px;
  font-weight:850;
  line-height:1.5
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px
}
.punch-btn{
  min-height:90px;
  border:0;
  border-radius:22px;
  color:white;
  font-weight:1000;
  font-size:18px
}
.left-btn{background:linear-gradient(145deg,#f43f5e,#b91c1c)}
.right-btn{background:linear-gradient(145deg,#60a5fa,#1d4ed8)}

.power-btn{
  width:100%;
  margin-top:10px;
  min-height:70px;
  background:#1f2937;
  color:#64748b
}
.power-btn.ready{
  background:linear-gradient(135deg,#f59e0b,#dc2626);
  color:white;
  box-shadow:0 0 22px #f59e0b88
}

.toggleline{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px
}
.toggle{
  border:1px solid #334155;
  border-radius:999px;
  padding:8px 11px;
  background:#111827;
  color:#cbd5e1;
  font-size:12px;
  font-weight:900
}
.toggle.on{color:#86efac}

.bottom-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px
}
.secondary{background:#202b40}
.finish{background:#15803d}
.result{
  display:none;
  margin-top:10px;
  background:#052e16;
  border:1px solid #166534;
  padding:14px;
  border-radius:16px
}
.tip{
  font-size:11px;
  color:#64748b;
  text-align:center;
  margin-top:9px
}
</style>
</head>

<body>

<div id="app" class="app">

<div class="logo">
<h1>🥊 STRESS PUNCH v3</h1>
<small>ARCADE</small>
</div>

<section id="setup" class="panel">

<div class="row">
<div class="label">1. 상대 얼굴 사진</div>
<label class="file-btn" for="photo">📷 사진 선택</label>
<input id="photo" type="file" accept="image/*">
<div id="fileName" class="file-name">선택된 사진 없음</div>
</div>

<div class="row">
<div class="label">2. 왜 화났어?</div>
<textarea id="reason" maxlength="180"
placeholder="예: 내 말을 계속 무시해서 열받음"></textarea>
</div>

<button id="start" class="btn start">게임 시작 🔥</button>

</section>

<section id="game" class="game">

<div class="stats">

<div class="statrow">
<div class="statlabel">상대 HP</div>
<div class="bar"><div id="hpFill" class="fill hpfill"></div></div>
<div id="hpNum" class="statnum">100</div>
</div>

<div class="statrow">
<div class="statlabel">POWER</div>
<div class="bar">
<div id="powerFill" class="fill powerfill"
style="transform:scaleX(0)"></div>
</div>
<div id="powerNum" class="statnum">0%</div>
</div>

</div>

<div class="topchips">
<div class="chip"><span id="hits">0</span> HIT</div>
<div class="chip">x<span id="combo">0</span> COMBO</div>
<div class="chip"><span id="dodges">0</span> DODGE</div>
</div>

<div id="stage" class="stage">

<div class="rope r1"></div>
<div class="rope r2"></div>
<div class="rope r3"></div>

<div id="target" class="target">

<div class="torso"></div>
<div class="neck"></div>

<div class="headwrap">

<div id="head" class="head">
<img id="face">
</div>

<div id="b1" class="bruise b1"></div>
<div id="b2" class="bruise b2"></div>
<div id="b3" class="bruise b3"></div>
<div id="b4" class="bruise b4"></div>

</div>
</div>

<div id="leftGlove" class="glove left-glove"></div>
<div id="rightGlove" class="glove right-glove"></div>

<div id="ko" class="ko">K.O.</div>

</div>

<div id="message" class="msg">
왼손이나 오른손 펀치를 눌러봐.
</div>

<div class="controls">
<button id="leftBtn" class="punch-btn left-btn">
🥊 왼손 펀치
</button>

<button id="rightBtn" class="punch-btn right-btn">
🥊 오른손 펀치
</button>
</div>

<button id="powerBtn" class="btn power-btn" disabled>
⚡ POWER PUNCH
</button>

<div class="toggleline">
<button id="soundToggle" class="toggle on">🔊 소리 ON</button>
<button id="vibeToggle" class="toggle on">📳 진동 ON</button>
</div>

<div class="bottom-actions">
<button id="reset" class="btn secondary">다시 설정</button>
<button id="finish" class="btn finish">이제 됐다 😌</button>
</div>

<div id="result" class="result"></div>

</section>

</div>

<script>
const $=id=>document.getElementById(id);

const photo=$("photo");
const fileName=$("fileName");
const reasonInput=$("reason");

const setup=$("setup");
const game=$("game");

const face=$("face");
const target=$("target");
const head=$("head");

const leftGlove=$("leftGlove");
const rightGlove=$("rightGlove");

const hpFill=$("hpFill");
const hpNum=$("hpNum");

const powerFill=$("powerFill");
const powerNum=$("powerNum");

const hitsEl=$("hits");
const comboEl=$("combo");
const dodgesEl=$("dodges");

const message=$("message");

const powerBtn=$("powerBtn");

const b1=$("b1");
const b2=$("b2");
const b3=$("b3");
const b4=$("b4");

const ko=$("ko");
const result=$("result");

let imageData="";
let reason="";

let hp=100;
let power=0;

let hits=0;
let combo=0;
let dodges=0;

let consecutiveDodges=0;

let finished=false;

let soundOn=true;
let vibeOn=true;

let audioCtx=null;

const taunts=[
"어딜 때리냐 ㅋㅋ",
"느린데?",
"여기다 여기 👈",
"한 번 맞혀봐~",
"그게 펀치냐?",
"아깝다 ㅋㅋ",
"바람만 지나갔는데?"
];

photo.addEventListener("change",()=>{

const f=photo.files[0];

if(!f)return;

fileName.textContent=f.name;

const reader=new FileReader();

reader.onload=e=>{
imageData=e.target.result;
};

reader.readAsDataURL(f);

});

function unlockAudio(){

if(!audioCtx){

audioCtx=new(
window.AudioContext||
window.webkitAudioContext
)();

}

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

}

function punchSound(strong=false){

if(!soundOn)return;

unlockAudio();

const now=audioCtx.currentTime;

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.type="triangle";

osc.frequency.setValueAtTime(
strong?65:90,
now
);

osc.frequency.exponentialRampToValueAtTime(
40,
now+.1
);

gain.gain.setValueAtTime(
strong?.35:.2,
now
);

gain.gain.exponentialRampToValueAtTime(
.001,
now+.15
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
osc.stop(now+.16);

}

function vibration(strong=false){

if(!vibeOn)return;

if(!navigator.vibrate)return;

if(strong){

navigator.vibrate([
50,
20,
70
]);

}else{

navigator.vibrate(30);

}

}

function updateUI(){

hp=Math.max(
0,
Math.min(100,hp)
);

power=Math.max(
0,
Math.min(100,power)
);

hpFill.style.transform=
"scaleX("+(hp/100)+")";

powerFill.style.transform=
"scaleX("+(power/100)+")";

hpNum.textContent=
Math.round(hp);

powerNum.textContent=
Math.round(power)+"%";

hitsEl.textContent=hits;

comboEl.textContent=combo;

dodgesEl.textContent=dodges;

if(power>=100){

powerBtn.disabled=false;

powerBtn.classList.add("ready");

powerBtn.textContent=
"⚡ POWER PUNCH 준비 완료!";

}else{

powerBtn.disabled=true;

powerBtn.classList.remove("ready");

powerBtn.textContent=
"⚡ POWER PUNCH "+Math.round(power)+"%";

}

}

function updateBruises(){

b1.style.opacity=
hp<=80?1:0;

b2.style.opacity=
hp<=60?1:0;

b3.style.opacity=
hp<=40?1:0;

b4.style.opacity=
hp<=20?1:0;

}

function pop(text,cls=""){

const p=
document.createElement("div");

p.className=
"pop "+cls;

p.textContent=text;

p.style.left="50%";
p.style.top="34%";

$("stage").appendChild(p);

setTimeout(()=>{
p.remove();
},700);

}

function animateGlove(side,strong=false){

const glove=
side==="left"
?leftGlove
:rightGlove;

glove.classList.remove(
"punch",
"super"
);

void glove.offsetWidth;

glove.classList.add(
strong
?"super"
:"punch"
);

}

function animateHead(side){

head.className="head";

void head.offsetWidth;

head.classList.add(
side==="left"
?"hit-right"
:"hit-left"
);

}

function dodge(){

dodges++;

combo=0;

consecutiveDodges++;

hp+=3;

power+=15;

const dir=
Math.random()>.5
?"dodge-left"
:"dodge-right";

target.classList.add(dir);

setTimeout(()=>{

target.classList.remove(
"dodge-left",
"dodge-right"
);

},280);

pop(
"MISS!",
"miss"
);

setTimeout(()=>{

pop(
"+3 HP",
"heal"
);

},120);

const taunt=
taunts[
Math.floor(
Math.random()*taunts.length
)
];

message.textContent=
'😏 "'+
taunt+
'" — 피하면서 HP 회복!';

updateUI();

}

function punch(side){

if(finished)return;

unlockAudio();

let dodgeChance=.22;

if(hp<=50){
dodgeChance=.15;
}

if(hp<=25){
dodgeChance=.08;
}

if(consecutiveDodges>=2){
dodgeChance=0;
}

animateGlove(
side,
false
);

if(
Math.random()
<
dodgeChance
){

dodge();

return;

}

consecutiveDodges=0;

combo++;

hits++;

const critical=
combo%7===0;

const damage=
critical?8:4;

hp-=damage;

power+=
critical?14:10;

animateHead(side);

punchSound(
critical
);

vibration(
critical
);

if(critical){

pop(
"CRITICAL!"
);

message.textContent=
"🔥 "+combo+
" COMBO! 크리티컬 -"+
damage+
" HP!";

}else{

pop(
["퍽!","퐉!","POW!","BAM!"]
[Math.floor(Math.random()*4)]
);

message.textContent=
"정통으로 들어갔다! -"+
damage+
" HP";

}

updateBruises();

updateUI();

checkKO();

}

function powerPunch(){

if(power<100)return;

if(finished)return;

power=0;

const damage=24;

hp-=damage;

hits++;
combo++;

const side=
Math.random()>.5
?"left"
:"right";

animateGlove(
side,
true
);

animateHead(side);

target.classList.add(
"wobble"
);

setTimeout(()=>{

target.classList.remove(
"wobble"
);

},500);

punchSound(true);

vibration(true);

pop(
"💥 SUPER HIT!"
);

message.textContent=
"⚡ POWER PUNCH! 회피 불가! -24 HP!";

updateBruises();

updateUI();

checkKO();

}

function checkKO(){

if(hp>0)return;

hp=0;

finished=true;

ko.classList.add(
"show"
);

message.textContent=
"K.O.! 오늘 스트레스는 여기까지.";

result.style.display=
"block";

result.innerHTML=
"🥊 <b>"+
hits+
" HIT / "+
dodges+
"회 회피당함</b><br>"+
"POWER까지 모아서 결국 KO!";

updateUI();

}

$("start").addEventListener(
"click",
()=>{

if(!imageData){

alert(
"먼저 얼굴 사진을 선택해줘."
);

return;

}

unlockAudio();

reason=
reasonInput.value.trim();

face.src=imageData;

hp=100;
power=0;

hits=0;
combo=0;
dodges=0;

consecutiveDodges=0;

finished=false;

[b1,b2,b3,b4]
.forEach(x=>{
x.style.opacity=0;
});

ko.classList.remove(
"show"
);

result.style.display=
"none";

message.textContent=
reason
?'“'+reason+'” 때문에 쌓였지? 잡아보자. 근데 얘가 가끔 피한다.'
:"잡아보자. 근데 얘가 가끔 피하면서 놀린다.";

setup.style.display=
"none";

game.style.display=
"block";

updateUI();

});

$("leftBtn")
.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

punch(
"left"
);

});

$("rightBtn")
.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

punch(
"right"
);

});

powerBtn
.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

powerPunch();

});

$("soundToggle")
.addEventListener(
"click",
()=>{

soundOn=
